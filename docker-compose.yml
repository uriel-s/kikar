# Local development stack: PostgreSQL, the API, and the web client.
#
#   cp .env.example .env     # fill in the Firebase values
#   docker compose up --build
#
# The client is served at http://localhost:3000, the API at http://localhost:5000.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kikar
      POSTGRES_PASSWORD: kikar
      POSTGRES_DB: kikar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this rather than racing Postgres to accept connections.
      test: ["CMD-SHELL", "pg_isready -U kikar -d kikar"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://kikar:kikar@db:5432/kikar?schema=public
      DATABASE_SSL: "false"
      CORS_ORIGINS: http://localhost:3000
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # Applies pending migrations before serving. Safe to re-run: migrate deploy
    # skips anything already applied.
    command: >
      sh -c "npm run db:deploy --workspace=@kikar/server &&
             node apps/server/src/server.js"

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN}
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${REACT_APP_FIREBASE_STORAGE_BUCKET}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID}
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres-data:
