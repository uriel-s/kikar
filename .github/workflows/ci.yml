name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without this, jobs inherit whatever the
# repository default is — which can include write access to contents, issues,
# and packages. Nothing here needs more than reading the checkout, so a
# compromised action in the dependency tree has nothing to write to.
permissions:
  contents: read

jobs:
  # Until this job existed, no CI job ran ESLint. The client's lint gate was an
  # accident of Create React App: `eslintConfig` in apps/client/package.json was
  # picked up by react-scripts' bundled ESLint 8, and CI=true turned its warnings
  # into build failures. Moving to an ESLint 9 flat config removed that block —
  # eslint-webpack-plugin uses the legacy eslintrc loader and never reads
  # eslint.config.js — which would have left the repository with a lint setup
  # that nothing enforced.
  #
  # Runs checks.sh rather than eslint/prettier directly so there is one
  # definition of "green" and it cannot drift from what CLAUDE.md tells
  # contributors to run locally.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: bash .claude/checks.sh lint

      - name: Format
        run: bash .claude/checks.sh format

      # Added in the TS-migration review: nothing else in CI ran this. ts-jest
      # transpiles rather than type-checks (see jest.config.js), and the
      # server job's own build step only covers src/ — apps/server/tsconfig.json
      # excludes tests/. Without this step a type error under
      # apps/server/tests/** merged undetected until someone ran
      # `checks.sh all` locally by hand.
      - name: Types
        run: bash .claude/checks.sh types

  server:
    name: Server - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so it has to exist before
      # anything that imports it can run.
      - run: npm run db:generate --workspace=@kikar/server

      # @kikar/shared is a real workspace dependency of @kikar/server, resolved
      # through ordinary node_modules resolution rather than a tsconfig path
      # alias — so, like the Prisma client above, it has to be built before the
      # server build and the test run below, both of which import it.
      - name: Build the shared package
        run: npm run build --workspace=@kikar/shared

      # The smoke step below boots apps/server/dist, so it has to be compiled
      # first. Stated as its own step rather than left to checks.sh: that script
      # does build when dist is missing, but relying on it would make the job
      # silently dependent on a side effect, and a build failure would then be
      # reported as a smoke failure.
      - name: Build the server
        run: npm run build --workspace=@kikar/server

      - name: Run tests
        run: npm run test --workspace=@kikar/server

      # Separate from the suite on purpose. The tests inject a fake token
      # verifier, so src/config/firebase.ts is the one module they never load —
      # which is how a server that could not boot at all reached main with 52
      # tests green. This boots the real thing.
      - name: Startup smoke check
        run: bash .claude/checks.sh smoke

  client:
    name: Client - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs checks.sh rather than the build directly, so CI and the local
      # contract cannot drift — and so CI inherits the assertion that the
      # bundle does not carry a localhost API URL. checks.sh supplies the
      # placeholder Firebase values; src/firebase.js only needs them present.
      - name: Build
        run: bash .claude/checks.sh build

  migrations:
    name: Server - migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kikar
          POSTGRES_PASSWORD: kikar
          POSTGRES_DB: kikar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kikar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Proves the checked-in SQL builds the schema from nothing, and that the
      # schema and the migrations have not drifted apart.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://kikar:kikar@localhost:5432/kikar_test?schema=public
        run: npm run db:deploy --workspace=@kikar/server

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:5000
            VITE_FIREBASE_API_KEY=ci-placeholder
            VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder
            VITE_FIREBASE_PROJECT_ID=ci-placeholder
            VITE_FIREBASE_STORAGE_BUCKET=ci-placeholder
            VITE_FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
            VITE_FIREBASE_APP_ID=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
