name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client is generated, not committed, so it has to exist before
      # anything that imports it can run.
      - run: npm run db:generate --workspace=@gazhan/server

      - name: Run tests
        run: npm run test --workspace=@gazhan/server

  client:
    name: Client - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Placeholder Firebase values: the build only needs them to be present,
        # since src/firebase.js fails fast on missing configuration. Real values
        # are supplied when building the deployment image.
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_FIREBASE_API_KEY: ci-placeholder
          REACT_APP_FIREBASE_AUTH_DOMAIN: ci-placeholder
          REACT_APP_FIREBASE_PROJECT_ID: ci-placeholder
          REACT_APP_FIREBASE_STORAGE_BUCKET: ci-placeholder
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          REACT_APP_FIREBASE_APP_ID: ci-placeholder
        run: npm run build --workspace=@gazhan/client

  migrations:
    name: Server - migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gazhan
          POSTGRES_PASSWORD: gazhan
          POSTGRES_DB: gazhan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazhan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Proves the checked-in SQL builds the schema from nothing, and that the
      # schema and the migrations have not drifted apart.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://gazhan:gazhan@localhost:5432/gazhan_test?schema=public
        run: npm run db:deploy --workspace=@gazhan/server

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: false
          build-args: |
            REACT_APP_API_URL=http://localhost:5000
            REACT_APP_FIREBASE_API_KEY=ci-placeholder
            REACT_APP_FIREBASE_AUTH_DOMAIN=ci-placeholder
            REACT_APP_FIREBASE_PROJECT_ID=ci-placeholder
            REACT_APP_FIREBASE_STORAGE_BUCKET=ci-placeholder
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
            REACT_APP_FIREBASE_APP_ID=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
