server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points at the current bundle
    # hashes, so a stale copy pins the browser to a deleted deployment.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's to resolve, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
